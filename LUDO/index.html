<!DOCTYPE html>
<html>

<head>
    <title>LUDO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="Back-Ludo">
        <div class="ludo-board">
            <div class="player-panel">
                <div class="top-section">
                    <div class="red-player player">
                        <div class="player-home">
                            <div class="token-section-top">
                                <div class="ludo-token-holder red-token-holder">
                                    <div class="ludo-token red-token" id="redToken1" onclick="SelectRedToken(this)">
                                    </div>
                                </div>
                                <div class="ludo-token-holder red-token-holder">
                                    <div class="ludo-token red-token" id="redToken2" onclick="SelectRedToken(this)">
                                    </div>
                                </div>
                            </div>
                            <div class="token-section-bottom">
                                <div class="ludo-token-holder red-token-holder">
                                    <div class="ludo-token red-token" id="redToken3" onclick="SelectRedToken(this)">
                                    </div>
                                </div>
                                <div class="ludo-token-holder red-token-holder">
                                    <div class="ludo-token red-token" id="redToken4" onclick="SelectRedToken(this)">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="top-path ver-path">
                        <div class="path-cell"></div>
                        <div class="path-cell center">
                            <div class="arrow arrow-down"></div>
                        </div>
                        <div class="path-cell"></div>

                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>

                        <div class="path-cell">
                            <div class="star red-star"></div>
                        </div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>

                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>

                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>

                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                    </div>
                    <div class="blue-player player">
                        <div class="player-home">
                            <div class="token-section-top">
                                <div class="ludo-token-holder blue-token-holder">
                                    <div class="ludo-token blue-token"></div>
                                </div>
                                <div class="ludo-token-holder blue-token-holder">
                                    <div class="ludo-token blue-token"></div>
                                </div>
                            </div>
                            <div class="token-section-bottom">
                                <div class="ludo-token-holder blue-token-holder">
                                    <div class="ludo-token blue-token"></div>
                                </div>
                                <div class="ludo-token-holder blue-token-holder">
                                    <div class="ludo-token blue-token"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="middle-section">
                    <div class="left-path hor-path">
                        <div class="path-cell"></div>
                        <div class="path-cell" id="redStartCell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell "></div>
                        <div class="path-cell center">
                            <div class="arrow arrow-right"></div>
                        </div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>

                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell">
                            <div class="yellow-star star"></div>
                        </div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                    </div>
                    <div class="home-section">
                        <div class="home-triangle red"></div>
                        <div class="home-triangle blue"></div>
                        <div class="home-triangle green"></div>
                        <div class="home-triangle yellow"></div>
                    </div>
                    <div class="right-path hor-path">
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell">
                            <div class="star blue-star"></div>
                        </div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>

                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell center">
                            <div class="arrow arrow-left"></div>
                        </div>

                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                    </div>
                </div>
                <div class="bottom-section">
                    <div class="yellow-player player">
                        <div class="player-home">
                            <div class="token-section-top">
                                <div class="ludo-token-holder yellow-token-holder">
                                    <div class="ludo-token yellow-token"></div>
                                </div>
                                <div class="ludo-token-holder yellow-token-holder">
                                    <div class="ludo-token yellow-token"></div>
                                </div>
                            </div>
                            <div class="token-section-bottom">
                                <div class="ludo-token-holder yellow-token-holder">
                                    <div class="ludo-token yellow-token"></div>
                                </div>
                                <div class="ludo-token-holder yellow-token-holder">
                                    <div class="ludo-token yellow-token"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bottom-path ver-path">
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>

                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>

                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>

                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell">
                            <div class="star green-star"></div>
                        </div>

                        <div class="path-cell"></div>
                        <div class="path-cell"></div>
                        <div class="path-cell"></div>

                        <div class="path-cell"></div>
                        <div class="path-cell center">
                            <div class="arrow arrow-top"></div>
                        </div>
                        <div class="path-cell"></div>
                    </div>
                    <div class="green-player player">
                        <div class="player-home">
                            <div class="token-section-top">
                                <div class="ludo-token-holder green-token-holder">
                                    <div class="ludo-token green-token"></div>
                                </div>
                                <div class="ludo-token-holder green-token-holder">
                                    <div class="ludo-token green-token"></div>
                                </div>
                            </div>
                            <div class="token-section-bottom">
                                <div class="ludo-token-holder green-token-holder">
                                    <div class="ludo-token green-token"></div>
                                </div>
                                <div class="ludo-token-holder green-token-holder">
                                    <div class="ludo-token green-token"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <!-- onclick="RollDice() -->
        <div class="dice" id="dice" onclick="RollDice()">
            <div class=" dice-dots" id="diceDots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
        <script src="script1.js"></script>
</body>

</html>
